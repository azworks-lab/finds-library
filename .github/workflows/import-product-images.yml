name: Import product images
on:
  push:
    paths:
      - 'finds_library_images_complete.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Unpack images and update catalog
        run: |
          python3 - <<'PY'
          import json, zipfile, pathlib, shutil
          archive = pathlib.Path('finds_library_images_complete.zip')
          if not archive.exists():
              raise SystemExit('Upload finds_library_images_complete.zip to repository root first')
          with zipfile.ZipFile(archive) as z:
              files = [i for i in z.infolist() if i.filename.startswith('images/') and i.filename.lower().endswith(('.jpg','.jpeg','.png'))]
              assert len(files) == 23, f'Expected 23 images, found {len(files)}'
              dest = pathlib.Path('images')
              dest.mkdir(exist_ok=True)
              for item in files:
                  target = dest / pathlib.Path(item.filename).name
                  with z.open(item) as source, target.open('wb') as output:
                      shutil.copyfileobj(source, output)
          catalog = pathlib.Path('data/products.json')
          data = json.loads(catalog.read_text(encoding='utf-8'))
          products = data['products'] if isinstance(data,dict) else data
          for p in products:
              path = dest / (p['id']+'.jpg')
              if path.exists():
                  p['photo'] = 'images/'+path.name
          catalog.write_text(json.dumps(data, ensure_ascii=False, indent=2)+'\n',encoding='utf-8')
          archive.unlink()
          print(f'Imported {len(files)} images, updated {sum(bool(p.get("photo")) for p in products)} photo links')
          PY
      - name: Commit images and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ data/products.json
          git rm -f --ignore-unmatch finds_library_images_complete.zip
          git diff --cached --quiet || git commit -m "Import all 23 product photos"
          git push
