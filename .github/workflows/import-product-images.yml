name: Import product images
on:
  push:
    paths:
      - 'finds_images_inbox.zip'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import:
    if: github.ref != 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Validate and import product photos
        run: |
          python3 - <<'PY'
          import json, pathlib, re, zipfile
          archive = pathlib.Path('finds_images_inbox.zip')
          if not archive.is_file():
              print('No inbox archive found; nothing to import')
              raise SystemExit(0)
          catalog = pathlib.Path('data/products.json')
          data = json.loads(catalog.read_text(encoding='utf-8'))
          products = data['products'] if isinstance(data, dict) else data
          by_id = {p['id']: p for p in products}
          updates = []
          with zipfile.ZipFile(archive) as z:
              entries = [i for i in z.infolist() if not i.is_dir()]
              if not entries or len(entries) > 100:
                  raise SystemExit('Archive must contain 1-100 image files')
              for entry in entries:
                  name = pathlib.PurePosixPath(entry.filename).name
                  match = re.fullmatch(r'([a-z0-9][a-z0-9_-]*)\.(jpg|jpeg|png|webp)', name, re.I)
                  if not match:
                      raise SystemExit(f'Invalid image filename: {entry.filename}')
                  product_id = match.group(1)
                  if product_id not in by_id:
                      raise SystemExit(f'No catalog product for image: {name}')
                  if entry.file_size > 10_000_000:
                      raise SystemExit(f'Image exceeds 10 MB: {name}')
                  payload = z.read(entry)
                  ext = match.group(2).lower()
                  valid = ((ext in ('jpg', 'jpeg') and payload.startswith(b'\xff\xd8\xff') and payload.endswith(b'\xff\xd9')) or
                           (ext == 'png' and payload.startswith(b'\x89PNG\r\n\x1a\n') and payload[-12:-8] == b'IEND') or
                           (ext == 'webp' and payload[:4] == b'RIFF' and payload[8:12] == b'WEBP'))
                  if not valid:
                      raise SystemExit(f'Invalid or incomplete image: {name}')
                  updates.append((name, product_id, payload))
          dest = pathlib.Path('images')
          dest.mkdir(exist_ok=True)
          for name, product_id, payload in updates:
              (dest / name).write_bytes(payload)
              by_id[product_id]['photo'] = 'images/' + name
          catalog.write_text(json.dumps(data, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')
          archive.unlink()
          print(f'Imported {len(updates)} images')
          PY
      - name: Commit photos and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ data/products.json
          git rm -f --ignore-unmatch finds_images_inbox.zip
          git diff --cached --quiet || git commit -m "Import product photos from inbox ZIP"
          git push
