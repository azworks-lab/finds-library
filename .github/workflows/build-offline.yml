name: Build offline library
on:
  push:
    branches:
      - finds-v2-image-test
    paths:
      - '.github/workflows/build-offline.yml'
      - 'data/products.json'
      - 'index.html'
      - 'images/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    if: github.ref == 'refs/heads/finds-v2-image-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate self-contained HTML
        run: |
          python3 - <<'PY'
          import pathlib, json, base64, re
          root = pathlib.Path('.')
          html = (root/'index.html').read_text(encoding='utf-8')
          data = json.loads((root/'data/products.json').read_text(encoding='utf-8'))
          local = 0
          remote = 0
          for product in data['products']:
              photo = product.get('photo', '')
              path = root / photo
              if photo.startswith('images/') and path.is_file() and path.suffix.lower() in ('.jpg','.jpeg','.png','.webp'):
                  mime = {'.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'}[path.suffix.lower()]
                  product['photo'] = 'data:'+mime+';base64,'+base64.b64encode(path.read_bytes()).decode('ascii')
                  local += 1
              elif photo.startswith('https://'):
                  remote += 1
              else:
                  raise RuntimeError('Missing or unsupported image: '+str(photo))
          loader = re.search(r"fetch\(location\.hostname==='raw\.githack\.com'.*?\{cache:'no-store'\}\)", html)
          assert loader, 'Cannot locate current catalog loader'
          embedded = 'Promise.resolve({ok:true,json:()=>Promise.resolve('+json.dumps(data,ensure_ascii=False,separators=(',',':'))+')})'
          html = html[:loader.start()] + embedded + html[loader.end():]
          html = re.sub(r"if\('serviceWorker' in navigator&&location.protocol==='https:'\).*?(?=</script>)", '', html, flags=re.S)
          html = html.replace('<title>FINDS — Библиотека находок</title>','<title>FINDS — Библиотека находок (офлайн)</title>')
          (root/'library-offline.html').write_text(html,encoding='utf-8')
          print(f'Built offline HTML: {len(data["products"])} products, {local} embedded photos, {remote} remote photo URLs')
          PY
      - name: Commit offline HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library-offline.html
          git diff --cached --quiet || (git commit -m "Build offline library [skip ci]" && git push)
