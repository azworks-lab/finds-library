name: Build offline library
on:
  push:
    paths:
      - '.github/workflows/build-offline.yml'
      - 'data/products.json'
      - 'index.html'
      - 'images/**'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Generate self-contained HTML
        run: |
          python3 - <<'PY'
          import pathlib, json, base64, re
          root = pathlib.Path('.')
          html = (root/'index.html').read_text(encoding='utf-8')
          data = json.loads((root/'data/products.json').read_text(encoding='utf-8'))
          count = 0
          for product in data['products']:
              path = root / product.get('photo', '')
              if path.is_file() and path.suffix.lower() in ('.jpg','.jpeg','.png','.webp'):
                  mime = {'.jpg':'image/jpeg','.jpeg':'image/jpeg','.png':'image/png','.webp':'image/webp'}[path.suffix.lower()]
                  product['photo'] = 'data:'+mime+';base64,'+base64.b64encode(path.read_bytes()).decode('ascii')
                  count += 1
          assert count == len(data['products']) == 23, f'Expected 23 photos, got {count}'
          start = "fetch('./data/products.json',{cache:'no-store'})"
          assert html.count(start) == 1, 'Cannot locate catalog loader'
          html = html.replace(start, 'Promise.resolve({ok:true,json:()=>Promise.resolve('+json.dumps(data,ensure_ascii=False,separators=(',',':'))+')})')
          html = html.replace('<title>Finds Library 3.1</title>','<title>Библиотека находок — офлайн</title>')
          html = re.sub(r"if\('serviceWorker' in navigator&&location.protocol==='https:'\).*?(?=</script>)", '', html, flags=re.S)
          (root/'library-offline.html').write_text(html,encoding='utf-8')
          print('Built offline HTML with',count,'photos')
          PY
      - name: Commit offline HTML
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add library-offline.html
          git diff --cached --quiet || (git commit -m "Build self-contained offline library [skip ci]" && git push)
