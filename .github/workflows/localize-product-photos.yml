name: Localize FINDS product photos
on:
  push:
    branches: [main]
    paths:
      - data/products.json
      - scripts/localize_product_images.py
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: finds-product-photos
  cancel-in-progress: false
jobs:
  localize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install image validation library
        run: python -m pip install --quiet Pillow
      - name: Download external photos into images
        run: python scripts/localize_product_images.py
      - name: Commit localized images and catalog references
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ data/products.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(images): store product photos locally"
            git push
          fi
