name: Generate public product pages
on:
  push:
    branches: [main]
    paths:
      - data/products.json
      - data/products.en.json
      - scripts/generate_product_pages.py
  workflow_dispatch:
  pull_request:
    paths:
      - 'data/products.json'
      - 'data/products.en.json'
      - 'scripts/generate_product_pages.py'
      - 'scripts/test_product_pages.py'
      - '.github/workflows/generate-product-pages.yml'
permissions:
  contents: write
concurrency:
  group: finds-public-product-pages
  cancel-in-progress: false
jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate static HTML for all products
        run: python3 scripts/test_product_pages.py
      - name: Generate static HTML
        run: python3 scripts/generate_product_pages.py
      - name: Commit generated pages
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add p/ en/p/
          if ! git diff --cached --quiet; then
            git commit -m "chore(pages): refresh public product HTML"
            for attempt in 1 2 3 4 5; do
              git fetch origin main
              if git rebase origin/main && git push origin HEAD:main; then
                exit 0
              fi
              git rebase --abort 2>/dev/null || true
              sleep 2
            done
            exit 1
          fi
