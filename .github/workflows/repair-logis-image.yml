name: Repair Logis 100 product image
on:
  push:
    paths:
      - 'data/logis-image-repair-request.json'
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/finds-v2-image-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and verify manufacturer PNG
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, struct, zlib
          config=json.loads(pathlib.Path('data/logis-image-repair-request.json').read_text())
          url=config['image_url']
          if not url.startswith('https://assets.hansgrohe.com/mam/celum/celum_assets/'):
              raise SystemExit('Image URL not allowed')
          request=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(request,timeout=30) as response:
              raw=response.read(5_000_001)
          if len(raw)>5_000_000 or not raw.startswith(bytes([137,80,78,71,13,10,26,10])):
              raise SystemExit('Invalid PNG')
          if raw[-12:-8] != bytes([0,0,0,0]) or raw[-8:-4] != b'IEND': raise SystemExit('Incomplete PNG')
          width,height=struct.unpack('>II',raw[16:24])
          if not (10 <= width <= 10000 and 10 <= height <= 10000): raise SystemExit('Invalid PNG dimensions')
          path=pathlib.Path('images/hansgrohe-logis-100.png')
          path.write_bytes(raw)
          catalog=pathlib.Path('data/products.json')
          data=json.loads(catalog.read_text(encoding='utf-8'))
          product=next(p for p in data['products'] if p['id']=='hansgrohe-logis-100')
          if product.get('photo'):\n              raise SystemExit('Existing Logis photo is protected; explicit migration required')\n          product['photo']='images/hansgrohe-logis-100.png'
          catalog.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print('Validated PNG bytes',len(raw),'dimensions',(width,height))
          PY
      - name: Commit photo and catalog
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/hansgrohe-logis-100.png data/products.json
          git diff --cached --quiet || git commit -m "Replace broken Logis photo with manufacturer PNG"
          git push
