name: Repair Logis 100 product image
on:
  push:
    paths:
      - 'data/logis-image-repair-request.json'
permissions:
  contents: write
jobs:
  repair:
    if: github.ref == 'refs/heads/finds-v2-image-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Find product photo and validate
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, re, html, io
          from html.parser import HTMLParser
          class Images(HTMLParser):
              def __init__(self): super().__init__(); self.candidates=[]
              def handle_starttag(self,tag,attrs):
                  d=dict(attrs)
                  if tag=='meta' and d.get('property') in ('og:image','twitter:image'):
                      self.candidates.append(d.get('content',''))
                  if tag in ('img','source'):
                      for k in ('src','data-src','srcset','data-srcset'):
                          v=d.get(k,'')
                          if v: self.candidates.append(v.split(',')[0].split(' ')[0])
          config=json.loads(pathlib.Path('data/logis-image-repair-request.json').read_text())
          page=config['page']
          if not page.startswith('https://www.hansgrohe.com/articledetail-logis-single-lever-basin-mixer-100-with-pop-up-waste-set-71100000'):
              raise SystemExit('Unexpected product page')
          def get(url):
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0 (compatible; FINDS/1.0)'})
              with urllib.request.urlopen(req,timeout=30) as resp:
                  if resp.status!=200: raise ValueError('HTTP status')
                  return resp.read(5_000_001)
          pagebytes=get(page)
          parser=Images();parser.feed(pagebytes.decode('utf-8','replace'))
          candidates=[]
          for x in parser.candidates:
              url=urllib.parse.urljoin(page,html.unescape(x))
              if not url.startswith('https://'): continue
              if not any(t in url.lower() for t in ('71100000','logis')): continue
              if url not in candidates: candidates.append(url)
          print('Candidate URLs:',candidates[:15])
          chosen=None
          for url in candidates[:15]:
              try:
                  raw=get(url)
                  if len(raw)>500 and len(raw)<=5_000_000 and raw.startswith(bytes([255,216,255])) and raw.endswith(bytes([255,217])):
                      from PIL import Image
                      im=Image.open(io.BytesIO(raw));im.verify()
                      chosen=(url,raw);break
              except Exception as e: print('Skip',url,str(e)[:120])
          if chosen is None: raise SystemExit('No validated JPEG found; original image left untouched')
          url,raw=chosen
          path=pathlib.Path('images/hansgrohe-logis-100.jpg')
          path.write_bytes(raw)
          print('Validated product JPEG',url,'bytes',len(raw))
          PY
      - name: Commit repaired image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/hansgrohe-logis-100.jpg
          git diff --cached --quiet || git commit -m "Repair Logis 100 product photo using verified JPEG"
          git push
