name: Probe EMOS P3541 image sources
on:
  workflow_dispatch:
  push:
    branches: [finds-v2-image-test]
    paths: [.github/workflows/probe-emos-p3541.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect verified manufacturer and reseller sources
        shell: python
        run: |
          import html.parser, urllib.request, urllib.parse, ssl, re, socket
          sources = [
            "https://www.emos.lv/cob-led-uzladejams-galvas-lukturis-p3541-380-lm-30-m-li-pol-1200-mah",
            "https://www.emos.pl/latarka-czolowa-led-cob-380-lm-li-pol-1200mah-ladowalna",
            "https://www.lemona.lv/en/cob-led-rechargeable-headlamp-380-lm-li-pol-1200-mah-emos-p3541.html",
            "https://tech-elektro.pl/pl/p/Latarka-czolowa-LED-COB%2C-380-lm-Li-Pol-1200mAh-ladowalna-EMOS/23096236",
          ]
          class Images(html.parser.HTMLParser):
            def __init__(self): super().__init__(); self.urls=[]
            def handle_starttag(self, tag, attrs):
              d=dict(attrs)
              if tag=="meta" and d.get("property") in ("og:image","og:image:secure_url"): self.urls.append(d.get("content",""))
              if tag in ("img","source"):
                for k in ("data-src","src","srcset","data-original"):
                  if d.get(k): self.urls.append(d[k].split(",")[0].split(" ")[0])
          for page in sources:
            print("\nPAGE",page,flush=True)
            try:
              req=urllib.request.Request(page,headers={"User-Agent":"Mozilla/5.0 (compatible; FINDS-QA/1.0)"})
              with urllib.request.urlopen(req,timeout=18) as r:
                body=r.read(2_000_000).decode("utf-8","replace")
                print("page_status",r.status,"bytes",len(body),flush=True)
              parser=Images();parser.feed(body)
              candidates=list(dict.fromkeys(urllib.parse.urljoin(page,u) for u in parser.urls if u and not u.startswith("data:")))
              prioritized=sorted(candidates,key=lambda u:(not bool(re.search(r"p3541|8592920112571",u,re.I)),not bool(re.search(r"product|media|image|catalog",u,re.I))))
              for image in prioritized[:12]:
                try:
                  req=urllib.request.Request(image,headers={"User-Agent":"Mozilla/5.0","Referer":page})
                  with urllib.request.urlopen(req,timeout=12) as r:
                    head=r.read(32)
                    typ=r.headers.get("Content-Type","")
                    print("IMAGE",r.status,typ,"signature",head[:12].hex(),"url",image[:250],flush=True)
                except Exception as e: print("IMAGE_ERROR",type(e).__name__,str(e)[:100],"url",image[:180],flush=True)
            except Exception as e: print("PAGE_ERROR",type(e).__name__,str(e)[:200],flush=True)
