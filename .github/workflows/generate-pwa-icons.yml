name: Generate PWA icons
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/generate-pwa-icons.yml'
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create PNG icons
        run: |
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from PIL import Image, ImageDraw
          for size in (192,512):
              scale=4
              s=size*scale
              im=Image.new('RGB',(s,s),'#101827')
              d=ImageDraw.Draw(im)
              w=lambda n:round(n*s/512)
              d.line([(w(142),w(264)),(w(219),w(341)),(w(370),w(172))],fill='#b8d7ff',width=w(39),joint='curve')
              for x,y in [(142,264),(219,341),(370,172)]:
                  rad=w(19)
                  d.ellipse((w(x)-rad,w(y)-rad,w(x)+rad,w(y)+rad),fill='#b8d7ff')
              d.line([(w(138),w(120)),(w(248),w(120))],fill='#7896bd',width=w(18))
              im.resize((size,size),Image.Resampling.LANCZOS).save('icon-'+str(size)+'.png')
          PY
      - name: Commit icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          git diff --cached --quiet || (git commit -m "Add installable PWA PNG icons [skip ci]" && git push)
