name: Generate FINDS PWA icons
on:
  workflow_dispatch:
  push:
    branches: [fix-pwa-icon-refresh-20261023]
    paths: [.github/workflows/generate-pwa-icons.yml]
permissions:
  contents: write
jobs:
  icons:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-pwa-icon-refresh-20261023
      - name: Generate PNG icons from approved FINDS mark
        run: |
          python -m pip install --quiet cairosvg
          python - <<'PY'
          import cairosvg
          for size in (192, 512):
              cairosvg.svg2png(url='finds-mark.svg',write_to=f'icon-{size}.png',output_width=size,output_height=size)
          PY
      - name: Commit generated icons
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add icon-192.png icon-512.png
          if ! git diff --cached --quiet; then
            git commit -m "fix(pwa): add raster FINDS icons from approved SVG"
            git push
          fi
