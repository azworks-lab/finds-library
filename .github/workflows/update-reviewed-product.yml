name: Update reviewed FINDS product
on:
  push:
    branches:
      - test/logis-update-import
    paths:
      - 'data/product-update-request.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  update:
    if: github.ref == 'refs/heads/test/logis-update-import'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update reviewed product and optional photo
        run: python3 scripts/update_reviewed_product.py
      - name: Validate complete catalog
        run: python3 scripts/validate_catalog.py
      - name: Commit catalog and downloaded image
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github-actions.com"
          git add data/products.json images/
          git rm -f --ignore-unmatch data/product-update-request.json
          git diff --cached --quiet || (git commit -m "Update reviewed FINDS product and photo" && git push)
