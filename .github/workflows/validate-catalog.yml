name: Validate FINDS V2 catalog
on:
  workflow_dispatch:
  push:
    branches:
      - finds-v2-image-test
    paths:
      - 'data/products.json'
      - 'images/**'
      - 'scripts/validate_catalog.py'
      - '.github/workflows/validate-catalog.yml'
permissions:
  contents: read
jobs:
  validate:
    if: github.ref == 'refs/heads/finds-v2-image-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate catalog and local images
        run: python3 scripts/validate_catalog.py
