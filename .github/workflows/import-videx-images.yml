name: Import VIDEX product photos
on:
  push:
    paths:
      - 'data/videx-image-import-request.json'
permissions:
  contents: write
jobs:
  import:
    if: github.ref == 'refs/heads/finds-v2-image-test'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download and validate exact VIDEX product images
        run: |
          python3 - <<'PY'
          import json, pathlib, urllib.request, urllib.parse, io, struct, re, html
          from html.parser import HTMLParser
          def get(url):
              if not url.startswith('https://ledveikals.lv/') and not url.startswith('https://www.ledveikals.lv/'):
                  raise ValueError('URL outside LEDveikals.lv')
              req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as response:
                  return response.read(6_000_001)
          class ProductMeta(HTMLParser):
              def __init__(self): super().__init__();self.title='';self.images=[]
              def handle_starttag(self,tag,attrs):
                  a=dict(attrs)
                  if tag=='meta' and a.get('property') in ('og:title','og:image'):
                      if a['property']=='og:title': self.title=a.get('content','')
                      else: self.images.append(a.get('content',''))
          jobs=json.loads(pathlib.Path('data/videx-image-import-request.json').read_text())['products']
          catalog=pathlib.Path('data/products.json')
          data=json.loads(catalog.read_text(encoding='utf-8'))
          byid={p['id']:p for p in data['products']}
          updates=[]
          for job in jobs:
              query=urllib.parse.quote(job['search'])
              api='https://ledveikals.lv/wp-json/wc/store/v1/products?search='+query+'&per_page=40'
              products=json.loads(get(api))
              matches=[p for p in products if all(x.lower() in html.unescape(p.get('name','')).lower() for x in job['must_contain']) and not any(x.lower() in html.unescape(p.get('name','')).lower() for x in job['must_not_contain'])]
              print(job['id'],'matches:',[(p.get('id'),p.get('name')) for p in matches])
              if len(matches)!=1: raise SystemExit('Expected exactly one matching product for '+job['id'])
              product=matches[0]
              imgs=product.get('images') or []
              if not imgs: raise SystemExit('No image for '+job['id'])
              url=imgs[0]['src']
              raw=get(url)
              if len(raw)>6_000_000 or len(raw)<1000: raise SystemExit('Invalid image size')
              if raw.startswith(bytes([255,216,255])) and raw.endswith(bytes([255,217])):
                  ext='jpg'
              elif raw.startswith(bytes([137,80,78,71,13,10,26,10])) and raw[-8:-4]==b'IEND':
                  ext='png'
              elif raw[:4]==b'RIFF' and raw[8:12]==b'WEBP':
                  ext='webp'
              else: raise SystemExit('Unsupported image format')
              if job['id'] not in byid: raise SystemExit('Product ID absent')
              updates.append((job['id'],ext,raw,url))
          for id,ext,raw,url in updates:
              path=pathlib.Path('images')/(id+'.'+ext)
              path.write_bytes(raw)
              byid[id]['photo']=str(path)
              print('IMPORTED',id,len(raw),url)
          catalog.write_text(json.dumps(data,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
      - name: Commit product images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/ data/products.json
          git diff --cached --quiet || git commit -m "Import exact VIDEX product photos"
          git push
