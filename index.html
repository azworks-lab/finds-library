function menu(){const cats=['Все',...new Set(products.map(p=>p.category))].sort((a,b)=>a==='Все'?-1:b==='Все'?1:a.localeCompare(b,'ru'));$('categories').innerHTML=cats.map(c=>'<button data-cat="'+esc(c)+'" class="'+(activeCategory===c?'active':'')+'">'+esc(c==='Все'?'Все товары':c)+'</button>').join('');$('categories').hidden=activeCategory!=='Все';$('subcategories').hidden=activeCategory==='Все';let subs=activeCategory==='Все'?[]:[...new Set(products.filter(p=>p.category===activeCategory).map(p=>p.subcategory))].sort((a,b)=>a.localeCompare(b,'ru'));$('subcategories').innerHTML=(activeCategory==='Все'?'':'<button type="button" class="nav-back" id="navBack">← К разделам</button><div class="nav-selected">'+esc(activeCategory)+'</div>')+'<button data-sub="Все" class="'+(category===activeCategory&&subcategory==='Все'?'active':'')+'">'+(activeCategory==='Все'?'Показать все товары':'Все товары раздела')+' →</button>'+subs.map(s=>'<button data-sub="'+esc(s)+'" class="'+(category===activeCategory&&subcategory===s?'active':'')+'">'+esc(s)+' →</button>').join('')}

$('homeButton').onclick=()=>{focusName=null;historyStack=[];category='Все';subcategory='Все';activeCategory='Все';$('search').value='';$('status').value='';$('sort').value='new';menu();setNav(false);closeFilters();render();window.scrollTo({top:0,behavior:'smooth'})};$('navToggle').onclick=()=>{if(navExpanded){setNav(false)}else{activeCategory='Все';menu();setNav(true)}};$('categories').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;activeCategory=b.dataset.cat;if(activeCategory==='Все'){category='Все';subcategory='Все';focusName=null;historyStack=[];setNav(false);render()}else{menu()}};$('subcategories').onclick=e=>{if(e.target.closest('#navBack')){activeCategory='Все';menu();return}const b=e.target.closest('[data-sub]');if(!b)return;category=activeCategory;subcategory=b.dataset.sub;focusName=null;historyStack=[];$('search').value='';recentCollapse();setNav(false);render();document.querySelector('.results').scrollIntoView({behavior:'smooth',block:'start'})};
$('search').oninput=()=>{focusName=null;historyStack=[];if($('search').value){recentCollapse();setNav(false)}render()};$('clearSearch').onclick=()=>{focusName=null;historyStack=[];$('search').value='';render();$('search').focus()};$('toggleRecent').onclick=()=>{let next=$('recent').hidden;$('recent').hidden=!next;$('toggleRecent').textContent=next?'⌃':'⌄';$('toggleRecent').setAttribute('aria-expanded',String(next));$('toggleRecent').setAttribute('aria-label',next?'Свернуть последние товары':'Показать последние товары')};
$('recent').onclick=e=>{focusName=null;historyStack=[];const b=e.target.closest('[data-recent]');if(!b)return;$('search').value=b.dataset.recent;category='Все';subcategory='Все';$('status').value='';recentCollapse();setNav(false);render();let card=$('cards').querySelector('details');if(card){card.open=true;card.scrollIntoView({behavior:'smooth',block:'center'})}};
$('newSort').onclick=()=>{$('sort').value='new';render()};$('alphaSort').onclick=()=>{$('sort').value=$('sort').value==='az'?'za':'az';render()};$('activeFilters').onclick=e=>{const b=e.target.closest('[data-clear]');if(!b)return;if(b.dataset.clear==='category'){category='Все';subcategory='Все';activeCategory='Все';menu()}else $('status').value='';render()};$('cards').addEventListener('toggle',e=>{if(!e.target.matches('details.card')||!e.target.open)return;for(const d of $('cards').querySelectorAll('details.card'))if(d!==e.target)d.open=false},true);const closeFilters=()=>{$('filterShade').hidden=true;document.body.style.overflow=''};$('filterOpen').onclick=()=>{$('filterShade').hidden=false;document.body.style.overflow='hidden'};$('filterClose').onclick=closeFilters;$('filterShade').onclick=e=>{if(e.target===$('filterShade'))closeFilters()};$('applyFilters').onclick=()=>{closeFilters();recentCollapse();render()};$('resetAll').onclick=()=>{focusName=null;historyStack=[];$('status').value='';$('sort').value='new';$('search').value='';category='Все';subcategory='Все';activeCategory='Все';menu();render();closeFilters()};document.addEventListener('keydown',e=>{if(e.key==='Escape')closeFilters()});fetch('./data/products.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw Error('HTTP '+r.status);return r.json()}).then(data=>{const raw=(data.products||[]).filter(p=>['Куплено','Выбрано','В комплекте','Кандидат'].includes(p.status));const names=new Map(raw.map(p=>[p.id,p.name]));products=raw.map(p=>({...p,related:(p.related||[]).filter(id=>names.has(id))}));$('recent').innerHTML=raw.filter(p=>p.addedAt).sort((a,b)=>b.addedAt.localeCompare(a.addedAt)).slice(0,3).map(p=>'<button data-recent="'+esc(p.name)+'">'+esc(p.name)+'</button>').join('');$('stats').textContent=products.length+' карточки · '+products.filter(p=>p.status==='Куплено').length+' куплено · '+products.filter(p=>p.status==='Выбрано').length+' выбрано · '+products.filter(p=>p.status==='В комплекте').length+' в комплекте';menu();setNav(false);render()}).catch(e=>{$('cards').innerHTML='<p role="alert">Не удалось загрузить каталог. Проверьте подключение.</p>';console.error(e)});if('serviceWorker' in navigator&&location.protocol==='https:')window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(console.error));
</script></body></html>
