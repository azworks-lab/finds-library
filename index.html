<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#101827"><link rel="manifest" href="./manifest.webmanifest"><link rel="icon" type="image/svg+xml" href="./icon.svg"><meta name="description" content="Личная библиотека удачных находок">
<title>Библиотека удачных находок 2.0</title>
<style>
:root{color-scheme:dark;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#0d111a;color:#edf1f7}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer}a{color:#9dc5ff}.wrap{max-width:1120px;margin:auto;padding:24px 18px 80px}header{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:30px}.logo{font-size:13px;letter-spacing:.15em;color:#a3afc3;text-transform:uppercase}.tag{font-size:12px;border:1px solid #33445c;border-radius:999px;padding:6px 10px;color:#b6c9e5}h1{font-size:clamp(28px,5vw,45px);letter-spacing:-.04em;margin:0 0 10px}h2{font-size:19px;margin:30px 0 15px}p{color:#aab5c5}.intro{max-width:650px;line-height:1.5}.tools{display:grid;grid-template-columns:1fr 180px;gap:10px;margin:24px 0}.tools input,.tools select{width:100%;padding:14px;border-radius:12px;background:#161e2d;color:#f2f5fa;border:1px solid #344158;outline-offset:3px}.categories{display:flex;gap:8px;flex-wrap:wrap}.chip{border:1px solid #344158;background:#151d2b;color:#c7d2e2;border-radius:999px;padding:9px 13px}.chip.active{background:#e4ecfb;color:#162032;border-color:#e4ecfb}.cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:14px}.card{border:1px solid #2e3a4c;background:#161e2c;border-radius:16px;overflow:hidden}.card summary{cursor:pointer;padding:19px;list-style:none}.card summary::-webkit-details-marker{display:none}.card summary:focus-visible{outline:2px solid #9dc5ff}.eyebrow{font-size:12px;color:#9fb0c7;margin-bottom:10px}.name{font-size:18px;font-weight:700;line-height:1.3}.sub{font-size:13px;color:#a5b1c2;margin-top:8px}.state{display:inline-block;font-size:12px;border:1px solid #4b617d;padding:4px 8px;border-radius:999px;margin-top:14px}.detail{padding:0 19px 20px;border-top:1px solid #293649;line-height:1.55}.detail p{margin:13px 0}.detail strong{color:#e6edf7}.shortcut{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.short{padding:15px;border:1px solid #35445b;background:#192335;border-radius:13px;min-width:0}.short b{display:block;overflow-wrap:anywhere}.short small{color:#aebad0}.empty{padding:35px 0;color:#b6c2d3}.foot{font-size:12px;margin-top:40px;color:#8f9db1}@media(max-width:620px){.tools{grid-template-columns:1fr}.shortcut{grid-template-columns:1fr}.wrap{padding-top:18px}}
</style></head>
<body><main class="wrap"><header><span class="logo">Finds Library</span><span class="tag">Версия 2.0</span></header>
<h1>Библиотека<br>удачных находок</h1><p class="intro">Только проверенные решения: куплено или выбрано. Без рекламного шума и бесконечных списков кандидатов.</p>
<section><h2>Последние решения</h2><div class="shortcut" id="shortcut"></div></section>
<section><h2>Каталог <span id="count"></span></h2><div class="categories" id="categories"></div>
<div class="tools"><input id="search" type="search" placeholder="Поиск по модели, бренду, артикулу…" aria-label="Поиск товаров">
<select id="status" aria-label="Фильтр статуса"><option value="">Все статусы</option><option>Куплено</option><option>Выбрано</option></select></div>
<div class="cards" id="cards" aria-live="polite"></div></section>
<p class="foot">Данные хранятся в репозитории GitHub. Цены без даты проверки не считаются актуальными.</p></main>
<script>
const el=id=>document.getElementById(id);let products=[],category="Все";
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function card(p){return '<details class="card"><summary><div class="eyebrow">'+safe(p.category)+' · '+safe(p.subcategory)+'</div><div class="name">'+safe(p.name)+'</div><div class="sub">'+safe(p.brand)+'</div><span class="state">'+safe(p.status)+'</span></summary><div class="detail">'+(p.sku?'<p><strong>Артикул:</strong> '+safe(p.sku)+'</p>':'')+'<p><strong>Характеристики:</strong> '+safe(p.specs)+'</p>'+(p.price?'<p><strong>Цена (историческая):</strong> '+safe(p.price)+'</p>':'')+'<p>'+safe(p.note)+'</p>'+(p.url?'<p><a href="'+safe(p.url)+'" target="_blank" rel="noopener noreferrer">Страница товара ↗</a></p>':'')+'</div></details>'}
function render(){const q=el("search").value.trim().toLocaleLowerCase("ru");const status=el("status").value;const filtered=products.filter(p=>(category==="Все"||p.category===category)&&(!status||p.status===status)&&JSON.stringify(p).toLocaleLowerCase("ru").includes(q));el("cards").innerHTML=filtered.length?filtered.map(card).join(""):'<div class="empty">По вашему запросу ничего не найдено.</div>';el("count").textContent='('+filtered.length+')';document.querySelectorAll(".chip").forEach(b=>{b.classList.toggle("active",b.dataset.category===category);b.setAttribute("aria-pressed",String(b.dataset.category===category))})}
function init(data){products=data.products||[];const cats=["Все",...new Set(products.map(p=>p.category))];el("categories").innerHTML=cats.map(c=>'<button type="button" class="chip" data-category="'+safe(c)+'">'+safe(c)+'</button>').join("");el("categories").addEventListener("click",e=>{const b=e.target.closest("button[data-category]");if(b){category=b.dataset.category;render()}});el("shortcut").innerHTML=products.slice(-3).reverse().map(p=>'<div class="short"><b>'+safe(p.name)+'</b><small>'+safe(p.status)+'</small></div>').join("");render()}
el("search").addEventListener("input",render);el("status").addEventListener("change",render);
fetch("./data/products.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(init).catch(e=>{el("cards").innerHTML='<div class="empty">Не удалось загрузить каталог. Откройте сайт через веб-сервер или GitHub Pages.</div>';console.error(e)});
if("serviceWorker" in navigator && location.protocol==="https:"){window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error))}
</script></body></html>
