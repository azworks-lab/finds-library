argin-top:14px}.meta{font-size:12px;color:#9aabc3}.price-history{margin:12px 0 0;padding-left:20px;color:#bac6d8;font-size:13px}.price-history li{margin:4px 0}.actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin:0 0 16px}.secondary{background:transparent;color:#d5e2f5;border:1px solid #43546e;border-radius:9px;padding:8px 12px}.secondary:hover{background:#253149}.sort{background:#161e2d;color:#f2f5fa;border:1px solid #344158;border-radius:9px;padding:8px 10px}.muted{color:#aebbd0;font-size:13px}.shortcut{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}.short{padding:15px;border:1px solid #35445b;background:#192335;border-radius:13px;min-width:0}.short b{display:block;overflow-wrap:anywhere}.short small{color:#aebad0}.empty{padding:35px 0;color:#b6c2d3}.foot{font-size:12px;margin-top:40px;color:#8f9db1}@media(max-width:620px){.tools{grid-template-columns:1fr}.shortcut{grid-template-columns:1fr}.wrap{padding-top:18px}}

<body><main class="wrap">
<header><span class="logo">Finds Library</span><span class="tag">Версия 3.1</span></header>
<h1>Библиотека удачных находок</h1>
<section id="recentSection"><div class="section-heading"><h2>Недавно добавлено</h2><button type="button" class="secondary" id="toggleRecent" aria-expanded="true">Свернуть</button></div><div id="recent" class="recent"></div></section>
<section class="catalog"><h2>Каталог <span id="count" class="muted"></span></h2>
<div class="searchline"><input id="search" type="search" placeholder="Поиск по модели, бренду, артикулу…" aria-label="Поиск товаров" autocomplete="off"><button id="reset" class="secondary" type="button">Сбросить всё</button></div>
<div class="actions"><button id="openNav" type="button" class="nav-trigger">☷ Разделы: <span id="selectedSection">Все товары</span> ▾</button><select id="status" aria-label="Фильтр статуса"><option value="">Все статусы</option><option>Куплено</option><option>Выбрано</option><option>В комплекте</option></select><select id="sort" aria-label="Сортировка"><option value="name">По названию</option><option value="status">По статусу</option><option value="category">По разделу</option></select></div>
<p id="visibleCount" class="muted" aria-live="polite" style="margin:4px 0 12px"></p><div id="focusBar" hidden><button id="goBack" type="button">← Назад</button></div><div class="cards" id="cards" aria-live="polite"></div></section>
<p class="foot" id="stats"></p></main>
<div class="nav-overlay" id="navOverlay" hidden><div class="nav-panel" role="dialog" aria-modal="true" aria-labelledby="navTitle"><div class="nav-top"><h2 id="navTitle">Разделы каталога</h2><button type="button" id="closeNav" class="secondary">Закрыть ✕</button></div><div class="nav-columns"><div id="navCategories" class="nav-categories" aria-label="Категории"></div><div id="navSubcategories" class="nav-subcategories" aria-label="Подразделы"></div></div></div></div>
<style>
.section-heading{display:flex;align-items:center;justify-content:space-between;gap:12px}.section-heading h2{margin:18px 0 12px}.recent{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px}.recent button{text-align:left;border:1px solid #35445b;background:#192335;color:#edf1f7;border-radius:12px;padding:12px;min-height:66px}.recent small{display:block;color:#aebbd0;margin-top:5px}.catalog{margin-top:20px}.searchline{display:flex;gap:8px;margin:12px 0}.searchline input{flex:1;min-width:0;padding:13px;border:1px solid #344158;border-radius:12px;background:#161e2d;color:#edf1f7;font-size:16px}.actions{display:grid;grid-template-columns:minmax(0,1fr) 150px 150px;gap:8px;margin:0 0 15px}.actions select,.nav-trigger{width:100%;min-height:45px;border:1px solid #43546e;background:#161e2d;color:#edf1f7;border-radius:10px;padding:9px;text-align:left}.nav-trigger{font-weight:600}.nav-overlay[hidden]{display:none}.nav-overlay{position:fixed;inset:0;background:#05070cbd;z-index:20;display:flex;align-items:center;justify-content:center;padding:12px}.nav-panel{background:#111a28;border:1px solid #35445b;border-radius:16px;width:min(760px,100%);height:min(85dvh,720px);display:flex;flex-direction:column;overflow:hidden}.nav-top{display:flex;justify-content:space-between;align-items:center;padding:12px 14px;border-bottom:1px solid #35445b}.nav-top h2{margin:0}.nav-columns{display:grid;grid-template-columns:42% 58%;min-height:0;flex:1}.nav-categories,.nav-subcategories{overflow-y:auto;padding:8px}.nav-categories{border-right:1px solid #35445b;background:#172132}.nav-categories button,.nav-subcategories button{display:block;width:100%;border:0;border-radius:9px;background:transparent;color:#dbe4f2;padding:12px 10px;text-align:left;line-height:1.35;min-height:46px;overflow-wrap:anywhere}.nav-categories button.active,.nav-subcategories button.active{background:#e4ecfb;color:#162032;font-weight:700}.nav-subcategories .nav-all{font-weight:700}.nav-subcategories .nav-group{color:#aebbd0;font-size:12px;padding:10px}.nav-categories button:focus-visible,.nav-subcategories button:focus-visible{outline:2px solid #9dc5ff}.card .detail p{overflow-wrap:anywhere}
@media(max-width:620px){.wrap{padding:14px 14px 65px}h1{font-size:28px;line-height:1.16}.recent{grid-template-columns:1fr;gap:6px}.recent button{min-height:48px;padding:10px 12px}.searchline{align-items:stretch}.searchline input{min-height:48px}.searchline .secondary{padding:8px;font-size:13px;max-width:104px}.actions{grid-template-columns:1fr 1fr}.nav-trigger{grid-column:1/-1}.nav-overlay{padding:0;align-items:stretch}.nav-panel{height:100dvh;max-height:none;border-radius:0;width:100%}.nav-columns{grid-template-columns:43% 57%}.nav-categories button,.nav-subcategories button{font-size:14px;padding:12px 8px}.section-heading h2{font-size:17px}.catalog{margin-top:12px}}
</style>
<script>
const el=id=>document.getElementById(id);let products=[],category="Все",subcategory="Все",navCategory="Все",recentOpen=true;
const safe=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let focusId=null,historyStack=[];const byId=id=>products.find(p=>p.id===id);
function card(p){const related=(p.related||[]).map(id=>byId(id)).filter(Boolean);const rows=(p.details||[]).filter(x=>!((p.sku&&x.label==='Артикул')||(p.price&&/^(Цена|Цена покупки|Цена за штуку)$/.test(x.label)))).map(x=>'<dt>'+safe(x.label)+'</dt><dd>'+safe(x.value)+'</dd>').join('');const extra='<dl><dt>Бренд</dt><dd>'+safe(p.brand||'—')+'</dd>'+(p.sku?'<dt>Артикул</dt><dd>'+safe(p.sku)+'</dd>':'')+(p.price?'<dt>Цена</dt><dd>'+safe(p.price)+'</dd>':'')+'</dl><h3>Технические характеристики</h3><dl>'+rows+'</dl>'+(p.note?'<h3>Наши заметки</h3><p>'+safe(p.note)+'</p>':'')+(related.length?'<h3>Связанные товары</h3><div class="related">'+related.map(x=>'<button type="button" data-related="'+safe(x.id)+'"><span>'+safe(x.name)+'</span><span>›</span></button>').join('')+'</div>':'')+(p.photo?'<img class="product-photo" src="'+safe(p.photo)+'" alt="Фото '+safe(p.name)+'" loading="lazy">':'')+(p.url?'<p><a href="'+safe(p.url)+'" target="_blank" rel="noopener noreferrer">Официальная страница / источник ↗</a></p>':'')+(p.sourceNote?'<p class="muted">'+safe(p.sourceNote)+'</p>':'');return '<details class="card" id="item-'+safe(p.id)+'"><summary><span class="status '+(p.status==='Куплено'?'':'selected')+'">'+safe(p.status)+'</span><div class="name">'+safe(p.name)+'</div><div class="preview">'+safe(p.specs)+'</div><div class="eyebrow">'+safe(p.category)+' · '+safe(p.subcategory)+'</div><span class="more-label">Подробнее ↓</span></summary><div class="detail">'+extra+'<button class="bottom-collapse" type="button" data-collapse="1">Свернуть ↑</button></div></details>'}
function jumpTo(id){if(!byId(id))return;historyStack.push({focusId,scroll:window.scrollY,opened:[...document.querySelectorAll('#cards details')].filter(x=>x.open).map(x=>x.id.slice(5))});focusId=id;render();const item=document.getElementById('item-'+id);if(item){item.open=true;requestAnimationFrame(()=>item.scrollIntoView({block:'start'}))}}
document.addEventListener('click',e=>{const link=e.target.closest('[data-related]');if(link){jumpTo(link.dataset.related);return}const collapse=e.target.closest('[data-collapse]');if(collapse){const d=collapse.closest('details');d.open=false;d.scrollIntoView({block:'nearest'})}});
document.getElementById('goBack').onclick=()=>{const h=historyStack.pop();if(!h)return;focusId=h.focusId;render();if(h){h.opened.forEach(id=>{const d=document.getElementById('item-'+id);if(d)d.open=true});requestAnimationFrame(()=>window.scrollTo(0,h.scroll))}};
function collapseRecent(){if(recentOpen){recentOpen=false;el("recent").hidden=true;el("toggleRecent").textContent="Показать";el("toggleRecent").setAttribute("aria-expanded","false")}}
function render(){const q=el("search").value.trim().toLocaleLowerCase("ru"),status=el("status").value;const filtered=products.filter(p=>(focusId?p.id===focusId:((q||category==="Все"||p.category===category)&&(q||subcategory==="Все"||p.subcategory===subcategory)&&(!status||p.status===status)&&[p.name,p.brand,p.sku,p.specs,p.note,p.category,p.subcategory,...(p.tags||[]),...(p.details||[]).map(x=>x.label+" "+x.value)].filter(Boolean).join(" ").toLocaleLowerCase("ru").includes(q))));const sort=el("sort").value;filtered.sort((a,b)=>sort==="status"?a.status.localeCompare(b.status,"ru")||a.name.localeCompare(b.name,"ru"):sort==="category"?a.category.localeCompare(b.category,"ru")||a.name.localeCompare(b.name,"ru"):a.name.localeCompare(b.name,"ru"));el("cards").innerHTML=filtered.length?filtered.map(card).join(""):'<div class="empty">Ничего не найдено.</div>';el("count").textContent='('+filtered.length+' из '+products.length+')';el("visibleCount").textContent=focusId?'Карточка товара':filtered.length+' из '+products.length+' товаров';el("selectedSection").textContent=category==="Все"?"Все товары":subcategory==="Все"?category:category+" / "+subcategory;el("focusBar").hidden=!focusId}
function closeNav(){el("navOverlay").hidden=true;document.body.style.overflow="";el("openNav").focus()}
function selectNav(cat,sub){focusId=null;historyStack=[];category=cat;subcategory=sub;el('search').value='';collapseRecent();render();closeNav()}
function navRender(){const cats=["Все",...new Set(products.map(p=>p.category))].sort((a,b)=>a==="Все"?-1:b==="Все"?1:a.localeCompare(b,"ru"));el("navCategories").innerHTML=cats.map(c=>'<button type="button" data-cat="'+safe(c)+'" class="'+(navCategory===c?'active':'')+'">'+safe(c==="Все"?"Все товары":c)+'</button>').join("");const subs=navCategory==="Все"?[]:[...new Set(products.filter(p=>p.category===navCategory).map(p=>p.subcategory))].sort((a,b)=>a.localeCompare(b,"ru"));el("navSubcategories").innerHTML=navCategory==="Все"?'<button class="nav-all" data-sub="Все" type="button">Показать все товары →</button>':'<button class="nav-all" data-sub="Все" type="button">Все товары раздела →</button>'+subs.map(s=>'<button type="button" data-sub="'+safe(s)+'" class="'+(category===navCategory&&subcategory===s?'active':'')+'">'+safe(s)+' →</button>').join("")}
function init(data){products=(data.products||[]).filter(p=>["Куплено","Выбрано","В комплекте"].includes(p.status));const recent=products.filter(p=>p.addedAt).sort((a,b)=>b.addedAt.localeCompare(a.addedAt)||products.indexOf(b)-products.indexOf(a)).slice(0,3);el("recent").innerHTML=recent.length?recent.map(p=>'<button type="button" data-recent="'+safe(p.id)+'"><strong>'+safe(p.name)+'</strong><small>'+safe(p.status)+'</small></button>').join(""):'<p>Новые поступления появятся здесь.</p>';el("stats").textContent=products.length+' товаров · '+products.filter(p=>p.status==="Куплено").length+' куплено · '+products.filter(p=>p.status==="Выбрано").length+' выбрано · '+products.filter(p=>p.status==="В комплекте").length+' в комплекте';render()}
el("toggleRecent").addEventListener("click",()=>{recentOpen=!recentOpen;el("recent").hidden=!recentOpen;el("toggleRecent").textContent=recentOpen?"Свернуть":"Показать";el("toggleRecent").setAttribute("aria-expanded",String(recentOpen))});
el("recent").addEventListener("click",e=>{const b=e.target.closest("[data-recent]");if(!b)return;const p=products.find(p=>p.id===b.dataset.recent);if(!p)return;focusId=null;historyStack=[];category="Все";subcategory="Все";el("search").value=p.name;el("status").value="";collapseRecent();render();const d=el("item-"+p.id);if(d){d.open=true;d.scrollIntoView({behavior:"smooth",block:"center"})}});
el("search").addEventListener("input",()=>{focusId=null;historyStack=[];if(el("search").value.trim())collapseRecent();render()});el("status").addEventListener("change",()=>{focusId=null;historyStack=[];collapseRecent();render()});el("sort").addEventListener("change",()=>{if(!focusId)render()});
el("reset").addEventListener("click",()=>{focusId=null;historyStack=[];category="Все";subcategory="Все";el("search").value="";el("status").value="";el("sort").value="name";render()});
el("openNav").addEventListener("click",()=>{navCategory=category;navRender();el("navOverlay").hidden=false;document.body.style.overflow="hidden";el("closeNav").focus()});el("closeNav").addEventListener("click",closeNav);
el("navOverlay").addEventListener("click",e=>{if(e.target===el("navOverlay"))closeNav()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!el("navOverlay").hidden)closeNav()});
el("navCategories").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;navCategory=b.dataset.cat;navRender()});el("navSubcategories").addEventListener("click",e=>{const b=e.target.closest("[data-sub]");if(b)selectNav(navCategory,b.dataset.sub)});
fetch("./data/products.json",{cache:"no-store"}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(init).catch(e=>{el("cards").innerHTML='<div class="empty">Не удалось загрузить каталог.</div>';console.error(e)});
if("serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
</script></body></html>
