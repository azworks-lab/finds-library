el("openNav").addEventListener("click",()=>{navCategory=category;navRender();el("navOverlay").hidden=false;document.body.style.overflow="hidden";el("closeNav").focus()});el("closeNav").addEventListener("click",closeNav);
el("navOverlay").addEventListener("click",e=>{if(e.target===el("navOverlay"))closeNav()});document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!el("navOverlay").hidden)closeNav()});
el("navCategories").addEventListener("click",e=>{const b=e.target.closest("[data-cat]");if(!b)return;navCategory=b.dataset.cat;navRender()});el("navSubcategories").addEventListener("click",e=>{const b=e.target.closest("[data-sub]");if(b)selectNav(navCategory,b.dataset.sub)});
Promise.resolve({ok:true,json:()=>Promise.resolve(window.__CATALOG_DATA__)}).then(r=>{if(!r.ok)throw Error("HTTP "+r.status);return r.json()}).then(init).catch(e=>{el("cards").innerHTML='<div class="empty">Не удалось загрузить каталог.</div>';console.error(e)});
if(false&&"serviceWorker" in navigator&&location.protocol==="https:")window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(console.error));
